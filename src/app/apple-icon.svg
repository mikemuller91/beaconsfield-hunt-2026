<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <!-- Background -->
  <rect width="180" height="180" fill="#1a2516" rx="40"/>
  <!-- Outer ring -->
  <circle cx="90" cy="90" r="70" stroke="#5a6b4a" stroke-width="6" fill="none"/>
  <!-- Middle ring -->
  <circle cx="90" cy="90" r="50" stroke="#4a5c3a" stroke-width="5" fill="none"/>
  <!-- Inner ring -->
  <circle cx="90" cy="90" r="30" stroke="#7a8b6a" stroke-width="4" fill="none"/>
  <!-- Center dot -->
  <circle cx="90" cy="90" r="10" fill="#a39171"/>
  <!-- Crosshairs -->
  <line x1="90" y1="10" x2="90" y2="40" stroke="#a39171" stroke-width="6" stroke-linecap="round"/>
  <line x1="90" y1="140" x2="90" y2="170" stroke="#a39171" stroke-width="6" stroke-linecap="round"/>
  <line x1="10" y1="90" x2="40" y2="90" stroke="#a39171" stroke-width="6" stroke-linecap="round"/>
  <line x1="140" y1="90" x2="170" y2="90" stroke="#a39171" stroke-width="6" stroke-linecap="round"/>
</svg>
